[project]
name = "init"
version = "0.1"
readme = "README.md"
authors = [{ name = "rsb-23" }]
requires-python = ">=3.11"
dependencies = ["yuhi"]

[project.optional-dependencies]
lint = ["pre-commit", "pylint"]
test = ["pytest", "pytest-cov"]

[tool.black]
line-length = 120
skip-magic-trailing-comma = true

[tool.flake8]
max-line-length = 120
ignore = ["E203", "E501", "W503"]
exclude = [".git", "__pycache__", ".venv"]
per-file-ignores = ["*/__init__.py: F401"]

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
split_on_trailing_comma = false

[tool.pylint]
jobs = 2
ignore-paths = ["^(?!^(src|tests?|.+.py)$).+$"]
max-line-length = 130

[tool.pylint.messages_control]
disable = [
    "I",
    "import-error",
    "fixme",
    "missing-docstring",
    "duplicate-code",
    "no-name-in-module"
]

[tool.coverage.report]
fail_under = 75.0
[tool.coverage.run]
source = ["src/"]
